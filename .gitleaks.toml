# gitleaks configuration: the default rules plus allowlisted false positives.
[extend]
useDefault = true

[allowlist]
description = "texture cache keys and made-up values in tests and docs that look like API keys"
regexes = [
  '''plaza-sign2-v6''',                    # a texture cache key
  '''mock-admin-token-0123456789abcdef''',  # the token of the mock backend in docs/contrib/APP.md
  '''key-12345678''',                       # an Idempotency-Key in test/contrib-mock.test.js
]
